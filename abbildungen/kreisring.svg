<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 228" width="400" height="228" role="img" aria-labelledby="title desc">
  <title id="title">Radien und Breite des Kreisrings</title>
  <desc id="desc">Der Außenradius R und der Innenradius r gehen vom selben Mittelpunkt aus. Die Differenz R − r ist die Breite des gefärbten Rings.</desc>
  <style>
    .line,.guide,.accent,.thin { fill:none; stroke:#24434a; stroke-width:2; stroke-linejoin:round }
    .guide { stroke:#657e83; stroke-width:1.2; stroke-dasharray:4 3 }
    .thin { stroke-width:1.2 }
    .accent { stroke:#006b65; stroke-width:2.6 }
    .tint { fill:#c6eae2 }
    .point { fill:#24434a }
    text { fill:#15383e; font:17px "Liberation Sans",Arial,sans-serif; text-anchor:middle }
    .math { font:italic 22px "Liberation Serif",Georgia,serif }
  </style>
  <rect width="400" height="228" fill="#f1f7f6"/>
  <circle cx="170" cy="111" r="84" class="tint"/>
  <circle cx="170" cy="111" r="60" fill="#f1f7f6"/>
  <circle cx="170" cy="111" r="84" class="line"/><circle cx="170" cy="111" r="60" class="line"/>
  <path class="line" d="M170 111h-60"/><path class="accent" d="m170 111 50.4-67.2"/>
  <circle cx="170" cy="111" r="3" class="point"/>
  <path class="accent" d="M230 111h24m-24-4v8m24-8v8"/>
  <path class="guide" d="M242 118l28 31h19"/>
  <text class="math" x="134" y="103">r</text><text class="math" x="204" y="87">R</text><text class="math" x="317" y="156">R − r</text>
</svg>
