    .point { fill:#24434a }
    text { fill:#15383e; font:17px "Liberation Sans",Arial,sans-serif; text-anchor:middle }
    .math { font:italic 22px "Liberation Serif",Georgia,serif }
  </style>
  <rect width="400" height="234" fill="#f1f7f6"/>
  <path class="tint" d="M109 28h164L109 192Z"/>
  <rect class="line" x="109" y="28" width="164" height="164"/>
